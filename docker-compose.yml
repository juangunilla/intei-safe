services:
  mongo:
    image: mongo:7
    container_name: inteli-pde-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - inteli-pde-network

  backend:
    build: ./backend
    container_name: inteli-pde-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/inteli_pde
      - JWT_SECRET=${JWT_SECRET:?Definí JWT_SECRET en el entorno}
      - JWT_EXPIRES_IN=7d
      - NODE_ENV=production
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.6-terra}
    depends_on:
      - mongo
    networks:
      - inteli-pde-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: inteli-pde-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - inteli-pde-network

  seed:
    build: ./backend
    container_name: inteli-pde-seed
    environment:
      - MONGODB_URI=mongodb://mongo:27017/inteli_pde
      - JWT_SECRET=${JWT_SECRET:?Definí JWT_SECRET en el entorno}
      - NODE_ENV=production
      - ALLOW_DESTRUCTIVE_SEED=${ALLOW_DESTRUCTIVE_SEED:-false}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-admin123}
      - SEED_USER_PASSWORD=${SEED_USER_PASSWORD:-user123}
    depends_on:
      - mongo
    networks:
      - inteli-pde-network
    command: npm run seed
    profiles:
      - seed

volumes:
  mongo_data:

networks:
  inteli-pde-network:
    driver: bridge
